<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- HAB Business PLC Official Monogram -->
  <defs>
    <style>
      .hab-black { fill: #121212; }
      .hab-yellow { fill: #FFDE00; }
      .hab-counter { fill: #FFFFFF; }
      @media (prefers-color-scheme: dark) {
        .hab-counter { fill: #0B0F17; }
      }
    </style>
  </defs>

  <!-- Yellow Inner Channels of H -->
  <!-- Upper Yellow Inset -->
  <path class="hab-yellow" d="M 54 20 L 92 20 L 92 70 C 92 88, 54 88, 54 70 Z" />
  
  <!-- Lower Yellow Inset with Brand Notch -->
  <path class="hab-yellow" d="M 54 130 C 54 112, 92 112, 92 130 L 92 180 L 54 180 L 54 158 L 38 158 L 38 146 L 54 146 Z" />

  <!-- Main Black / Obsidian Monogram Body (EvenOdd Compound Path) -->
  <path class="hab-black" fill-rule="evenodd" d="
    M 20 20 L 54 20 L 54 70 C 54 88, 92 88, 92 70 L 92 20 L 146 20 C 168 20, 180 32, 180 58 C 180 76, 170 88, 154 96 C 172 104, 184 118, 184 142 C 184 168, 168 180, 146 180 L 20 180 L 20 20 Z
    
    M 54 130 C 54 112, 92 112, 92 130 L 92 180 L 54 180 L 54 158 L 38 158 L 38 146 L 54 146 L 54 130 Z
    
    M 120 44 L 140 44 C 150 44, 156 50, 156 58 C 156 66, 150 74, 140 74 L 120 74 Z
    
    M 120 124 L 142 124 C 154 124, 160 130, 160 142 C 160 154, 154 160, 142 160 L 120 160 Z
  " />
</svg>
